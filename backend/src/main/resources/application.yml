# application.yml (모든 환경 공통)
spring:
  application:
    name: fivexbread
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/fivexbread?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:fivexbread}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  shutdown: graceful
  forward-headers-strategy: native   # Nginx 뒤에서 X-Forwarded-For 읽기 (정의서 13-5)