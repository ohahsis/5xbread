# application.yml (모든 환경 공통)
spring:
  application:
    name: fivexbread
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/fivexbread?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:fivexbread}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 1s
      timeout: 2s                 # 기본 60초면 Redis 장애 때 요청마다 60초 멈춘다. 목록의 DB 폴백·예약 503 이 이 시간 뒤에 나온다

server:
  shutdown: graceful
  tomcat:
    # 연결 대기열(listen backlog). 기본 100이면 재시작 직후 로그인 폭주 때 앱마다 수백 건의 SYN 이 버려지고,
    # 재전송이 Nginx proxy_connect_timeout(2s)을 넘기면 그 앱이 10초 동안 빠진다 (decisions.md "재시작 직후 로그인 폭주")
    accept-count: 1000
  forward-headers-strategy: native   # Nginx 뒤에서 X-Forwarded-For 읽기 (정의서 13-5)

fivexbread:
  jwt:
    secret: ${JWT_SECRET:}        # 저장소에 넣지 않음. 비어 있으면 앱이 뜨지 않음 (UTF-8 32바이트 이상)
    access-token-ttl: 30m         # 정의서 5장
    refresh-token-ttl: 14d        # 정의서 5장. Redis 키 TTL = 쿠키 Max-Age
  pickup:
    secret: ${PICKUP_SECRET:}     # 픽업 QR HMAC 키 (C-07). 저장소에 넣지 않음. 비어 있거나 32바이트 미만이면 앱이 뜨지 않음
  login:
    max-failures: 5               # AU-05, 부록 B: 연속 5회 실패하면
    failure-retention: 24h        # 실패 카운터 정리용 TTL, 실패할 때마다 갱신 (decisions.md 6장)
    lock-duration: 10m            # 5번째 실패부터 10분 잠금
  password-hash:
    max-concurrency: ${PASSWORD_HASH_MAX_CONCURRENCY:0}   # 앱 1개의 BCrypt 동시 계산 상한. 0이면 CPU 수 (BoundedPasswordEncoder)
  admin:
    initial-phone: ${ADMIN_INITIAL_PHONE:}         # 사장님 초기 계정 (decisions.md 2장). 비어 있으면 경고만 남기고 만들지 않음
    initial-password: ${ADMIN_INITIAL_PASSWORD:}   # 저장소에 넣지 않음. BCrypt 해시만 저장, 첫 로그인 때 변경 강제
  store:
    open-time: "08:00"             # 부록 B 영업시간. 픽업 시각은 이 시각 이상
    close-time: "21:00"            # 픽업 시각은 이 시각 미만
  reservation:
    daily-limit-per-member: 3     # 부록 B: 판매일별 1인 최대 예약 건수
    max-total-quantity: 20        # Q-07: 예약 1건 최대 총수량
    rate-limit-per-second: 5      # N-23: 회원당 초당 예약 요청
    idempotency-ttl: 24h          # N-06: Idempotency 결과 보관
  catalog-cache:
    ttl: 30s                      # 부록 B: 빵 정보 로컬 캐시. 무효화 메시지가 유실돼도 이 시간 뒤에는 맞는다
  no-show:
    # 부록 B: 매일 21:00 (zone 은 NoShowJob 의 Asia/Seoul). store.close-time 을 늦추면 이 시각도 함께 늦춰야 한다.
    # 앞서면 아직 픽업할 수 있는 예약이 노쇼가 된다. "-" 면 스케줄을 끈다
    cron: ${NO_SHOW_CRON:0 0 21 * * *}
  outbox:
    relay-cron: ${OUTBOX_RELAY_CRON:*/5 * * * * *}   # 폴러 주기. 앱 3개가 같은 초에 깨어나 ShedLock 을 잡은 1개만 돈다. "-" 면 끈다
    relay-delay: 10s              # 생성 후 이 시간이 지난 행만 폴러가 집는다. 커밋 후 바로 처리(평소 수 ms, Redis 시간 제한 2초)와 겹치지 않게
    batch-size: 100
    max-batches: 10               # 폴러 1회 최대 1,000건. 나머지는 다음 주기(5초 뒤)
    cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 30 4 * * *}   # 매일 04:30 발행한 행 정리
    retention: 7d                 # 발행한 행 보관 기간 (decisions.md 6장 "아웃박스 정리")
  reconcile:
    cron: ${RECONCILE_CRON:0 */5 * * * *}   # 13-10: 5분마다 정합성 점검(N-05). zone 은 StockReconcileJob 의 Asia/Seoul. "-" 면 끈다
    min-gap: 4m                   # 같은 차이를 2회로 세는 최소 간격. 주기(5분)보다 조금 짧게
    observation-ttl: 7m           # 첫 관측 보관. 다음 회차까지는 남고, 한 회차를 건너뛰면 처음부터 다시 센다
    manual-confirm-delay: 1s      # A-12 재계산의 두 관측 간격 (진행 중인 예약을 거른다)
  realtime:                       # C-03 실시간 잔여 (13-3)
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:}   # 화면 출처(https://bakery.example). 비우면 같은 출처만. 화면은 2차
    flush-interval: 200ms         # 13-3 5단계: 앱마다 빵별 최신 값을 모아 200ms마다 한 번
    heartbeat: 10s                # Nginx /ws proxy_read_timeout(3600s)보다 짧게
    send-time-limit: 10s          # 13-3 어필: 느린 클라이언트는 연결을 끊는다
    send-buffer-size-limit: 512KB
    listener-queue-capacity: 10000   # Redis 메시지 대기열. 차면 오래된 것부터 버린다(다음 메시지가 절대값이라 맞춰짐)
  signup:
    daily-limit-per-ip: 10        # AU-02, 부록 B
    terms-version: "v1"           # 서비스 이용약관
    privacy-version: "v1"         # 개인정보 수집·이용
