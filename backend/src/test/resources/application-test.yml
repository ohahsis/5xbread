# application-test.yml (테스트 전용. 실제 키가 아니다)
fivexbread:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123456789
  pickup:
    secret: test-only-pickup-secret-0123456789abcdef012345
  catalog-cache:
    ttl: 0s                       # DB 를 직접 바꾸는 테스트가 많아 기본은 캐시 없음. 캐시 동작은 SaleBreadsCacheApiTest 가 30초로 본다
  no-show:
    cron: "-"                     # 테스트는 메서드를 직접 호출한다. 실제 21:00 에 돌던 테스트와 겹치지 않게 끈다
