# infra/nginx/nginx.conf : 앱 3개 앞의 로드밸런서 (정의서 8장 인프라 표, 14장 예시)
worker_processes auto;

events {
  worker_connections 4096;          # 동시 예약 1,000건 + 앱 연결. 기본 512로는 부족
}

http {
  include /etc/nginx/mime.types;    # 정적 파일(손님 화면)의 Content-Type. 없으면 .js 가 text/plain 으로 나가 브라우저가 module 스크립트를 거부한다
  default_type application/octet-stream;

  # 어느 앱이 처리했는지는 X-Upstream 응답 헤더로 본다. 값은 "앱IP:8080" (앱 이름 ↔ IP 는 load/run.sh 가 docker inspect 로 바꿈).
  # 앱 내부 IP 가 손님에게 보이지 않도록, 호스트에 공개하지 않는 8081 포트로 들어온 요청에만 붙인다.
  # 그 포트는 compose 네트워크 안(k6 컨테이너)에서만 닿는다. 출발지 IP 로 나누지 않는 이유: Docker userland-proxy 를 거치면
  # 바깥 손님의 요청도 출발지가 게이트웨이(172.x.0.1)로 바뀌어 내부 요청과 구분되지 않는다.
  # add_header 는 값이 비면 헤더를 내보내지 않는다. map 은 쓰일 때 계산되므로 $upstream_addr 는 응답 시점의 값이다
  map $server_port $debug_upstream {
    8081    $upstream_addr;
    default '';
  }
  # $request 대신 $uri: 쿼리 문자열을 남기지 않는다. 사장님 회원 검색(?phone=)의 번호 원문이 로그에 남으면 안 된다 (AU-10)
  log_format upstream '$remote_addr "$request_method $uri" $status upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream;

  # WebSocket(C-03): Upgrade 요청이면 Connection: upgrade, 아니면 빈 값
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream app {                    # 라운드 로빈(기본). 상태는 Redis·MySQL 에만 있어 sticky session 이 필요 없다
    server app1:8080 max_fails=1 fail_timeout=10s;   # 한 번 실패하면 10초 동안 빼고 보낸다
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
    keepalive 64;                   # Nginx → 앱 연결을 재사용 (proxy_http_version 1.1 + Connection 비움 필요)
  }

  server {
    listen 80;                      # 손님용 (호스트에 공개)
    listen 8081;                    # 내부 확인용 (compose 네트워크 안에서만, X-Upstream 포함)
    client_max_body_size 6m;        # 빵 사진 업로드(5MB) 여유

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 클라이언트가 보낸 X-Forwarded-For 는 버리고 Nginx 가 본 주소로 덮는다. 앞에 다른 프록시가 없으므로
    # $proxy_add_x_forwarded_for(이어 붙이기)를 쓰면 손님이 IP 를 꾸며 가입 IP 제한(AU-02)을 피할 수 있다
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 이면 Upgrade 를 넘기고, 아니면 Connection 을 비워 keepalive 로 앱 연결을 재사용한다.
    # proxy_set_header 는 location 에 하나라도 쓰면 위 설정이 모두 상속되지 않으므로 여기 server 단계에만 둔다
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    add_header X-Upstream $debug_upstream always;     # 8081 로 들어온 요청만. always: 4xx·5xx 응답에도 붙인다

    # 죽은 앱 건너뛰기. error = 연결 실패(앱이 내려가 connection refused 등), timeout = 연결·응답 시간 초과.
    # Nginx 1.9.13부터 POST·PATCH 같은 멱등하지 않은 요청은 앱에 이미 보낸 뒤라면 다음 앱으로 다시 보내지 않는다
    # (non_idempotent 를 넣지 않았으므로). 그래서 연결부터 실패한 요청만 다른 앱으로 가고, 요청을 받은 앱이 응답 중에
    # 죽거나 느려진 예약 POST 는 502/504 로 끝난다. 다시 보내면 같은 예약이 두 앱에서 처리될 수 있기 때문이다
    # (손님의 재시도는 Idempotency-Key 가 막는다). 503(Redis 장애)은 모든 앱이 같으므로 다음 앱으로 넘기지 않는다
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;       # 연결이 안 되는 앱을 빨리 건너뛴다
    proxy_read_timeout 30s;         # API 응답 대기

    location /ws {                  # WebSocket(STOMP, C-03). 토큰은 CONNECT 프레임으로만 받는다(쿼리스트링이 접근 로그에 남지 않게)
      proxy_pass http://app;
      proxy_read_timeout 3600s;     # 메시지가 없어도 1시간은 끊지 않음 (정의서 8장)
      proxy_send_timeout 3600s;
    }

    location /actuator {            # 헬스·메트릭은 compose 네트워크 안에서만 (Prometheus 가 앱에 직접 붙는다)
      return 404;
    }

    location /api/ {                # REST API (앱 3개)
      proxy_pass http://app;
    }

    # 다시 보내면 안 되는 PUT·DELETE. Nginx 는 PUT·DELETE 를 멱등으로 보고, 앱이 요청을 받은 뒤 응답 전에 끊기거나
    # 30초를 넘겨도(error·timeout) 다음 앱으로 한 번 더 보낸다. 이 셋은 두 번 처리되면 결과가 달라진다.
    # - 토큰 재발급(PUT): 같은 Refresh Token 이 두 번 오면 두 번째가 재사용으로 판정돼 그 회원의 모든 토큰이 폐기된다(전체 로그아웃)
    # - 비밀번호 변경(PUT): 첫 번째가 바꾼 뒤 두 번째는 현재 비밀번호가 틀려 422, 손님은 성공했는데 실패로 본다
    # - 탈퇴(DELETE /members/me): 첫 번째가 탈퇴시킨 뒤 두 번째는 탈퇴한 회원이라 401
    # 대가: 연결부터 실패한(앱이 죽은) 경우도 다른 앱으로 넘기지 않아 502 로 끝난다. 그 앱은 max_fails=1 로 10초 동안 빠진다.
    # 같은 경로의 로그아웃(DELETE /auth/tokens/current)·내 정보(GET·PATCH /members/me)도 함께 꺼진다.
    # = 정확 일치라 /api/ 보다 먼저 고른다. proxy_set_header·add_header 는 이 location 들에 쓰지 않아 server 단계 것을 그대로 상속한다
    location = /api/v1/auth/tokens/current {
      proxy_next_upstream off;
      proxy_pass http://app;
    }

    location = /api/v1/members/me/password {
      proxy_next_upstream off;
      proxy_pass http://app;
    }

    location = /api/v1/members/me {
      proxy_next_upstream off;
      proxy_pass http://app;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {   # OpenAPI 명세·Swagger UI (frontend 의 gen:api 가 읽는다)
      proxy_pass http://app;
    }

    # 손님 화면 (frontend/). 빌드한 정적 파일을 이 이미지에 넣어 두었다 (frontend/Dockerfile).
    # 화면과 API 가 같은 출처라 CORS·WebSocket Origin 설정이 필요 없고, Refresh 쿠키(SameSite=Strict)도 그대로 붙는다.
    # 아래 location 들은 add_header 를 쓰므로 server 단계의 add_header(X-Upstream)를 상속하지 않는다. 정적 파일에는 필요 없는 헤더다
    location /assets/ {             # Vite 빌드 결과. 파일 이름에 내용 해시가 붙어 바뀌면 이름도 바뀐다 → 오래 캐시
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;          # 없는 파일을 index.html 로 돌리면 브라우저가 HTML 을 JS 로 읽는다
    }

    location / {                    # 그 밖의 경로(/breads, /reservations/3 …)는 index.html. 화면 경로는 React Router 가 고른다
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";   # 새로 배포하면 바로 새 index.html(→ 새 해시 파일)을 받게
      try_files $uri /index.html;
    }
  }
}
