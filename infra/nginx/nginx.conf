# infra/nginx/nginx.conf : 앱 3개 앞의 로드밸런서 (정의서 8장 인프라 표, 14장 예시)
worker_processes auto;

events {
  worker_connections 4096;          # 동시 예약 1,000건 + 앱 연결. 기본 512로는 부족
}

http {
  # 어느 앱이 처리했는지는 X-Upstream 응답 헤더로 본다. 값은 "앱IP:8080" (앱 이름 ↔ IP 는 load/run.sh 가 docker inspect 로 바꿈).
  # 앱 내부 IP 가 손님에게 보이지 않도록, 호스트에 공개하지 않는 8081 포트로 들어온 요청에만 붙인다.
  # 그 포트는 compose 네트워크 안(k6 컨테이너)에서만 닿는다. 출발지 IP 로 나누지 않는 이유: Docker userland-proxy 를 거치면
  # 바깥 손님의 요청도 출발지가 게이트웨이(172.x.0.1)로 바뀌어 내부 요청과 구분되지 않는다.
  # add_header 는 값이 비면 헤더를 내보내지 않는다. map 은 쓰일 때 계산되므로 $upstream_addr 는 응답 시점의 값이다
  map $server_port $debug_upstream {
    8081    $upstream_addr;
    default '';
  }
  # $request 대신 $uri: 쿼리 문자열을 남기지 않는다. 사장님 회원 검색(?phone=)의 번호 원문이 로그에 남으면 안 된다 (AU-10)
  log_format upstream '$remote_addr "$request_method $uri" $status upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream;

  # WebSocket(C-03): Upgrade 요청이면 Connection: upgrade, 아니면 빈 값
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream app {                    # 라운드 로빈(기본). 상태는 Redis·MySQL 에만 있어 sticky session 이 필요 없다
    server app1:8080 max_fails=1 fail_timeout=10s;   # 한 번 실패하면 10초 동안 빼고 보낸다
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
    keepalive 64;                   # Nginx → 앱 연결을 재사용 (proxy_http_version 1.1 + Connection 비움 필요)
  }

  server {
    listen 80;                      # 손님용 (호스트에 공개)
    listen 8081;                    # 내부 확인용 (compose 네트워크 안에서만, X-Upstream 포함)
    client_max_body_size 6m;        # 빵 사진 업로드(5MB) 여유

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 클라이언트가 보낸 X-Forwarded-For 는 버리고 Nginx 가 본 주소로 덮는다. 앞에 다른 프록시가 없으므로
    # $proxy_add_x_forwarded_for(이어 붙이기)를 쓰면 손님이 IP 를 꾸며 가입 IP 제한(AU-02)을 피할 수 있다
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 이면 Upgrade 를 넘기고, 아니면 Connection 을 비워 keepalive 로 앱 연결을 재사용한다.
    # proxy_set_header 는 location 에 하나라도 쓰면 위 설정이 모두 상속되지 않으므로 여기 server 단계에만 둔다
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    add_header X-Upstream $debug_upstream always;     # 8081 로 들어온 요청만. always: 4xx·5xx 응답에도 붙인다

    # 죽은 앱 건너뛰기. error = 연결 실패(앱이 내려가 connection refused 등), timeout = 연결·응답 시간 초과.
    # Nginx 1.9.13부터 POST·PATCH 같은 멱등하지 않은 요청은 앱에 이미 보낸 뒤라면 다음 앱으로 다시 보내지 않는다
    # (non_idempotent 를 넣지 않았으므로). 그래서 연결부터 실패한 요청만 다른 앱으로 가고, 요청을 받은 앱이 응답 중에
    # 죽거나 느려진 예약 POST 는 502/504 로 끝난다. 다시 보내면 같은 예약이 두 앱에서 처리될 수 있기 때문이다
    # (손님의 재시도는 Idempotency-Key 가 막는다). 503(Redis 장애)은 모든 앱이 같으므로 다음 앱으로 넘기지 않는다
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;       # 연결이 안 되는 앱을 빨리 건너뛴다
    proxy_read_timeout 30s;         # API 응답 대기

    location /ws {                  # WebSocket(STOMP, C-03에서 엔드포인트 추가)
      proxy_pass http://app;
      proxy_read_timeout 3600s;     # 메시지가 없어도 1시간은 끊지 않음 (정의서 8장)
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://app;
    }
  }
}
