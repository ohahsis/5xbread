# compose.full.yaml (레포 루트) : 앱 3개 + Nginx (정의서 8장 인프라 표, decisions.md 2장)
# 실행: docker compose -f compose.full.yaml up -d --build
# 개발용 compose.yaml 과 프로젝트 이름·볼륨·포트를 나눠, 두 환경의 데이터가 섞이지 않고 동시에 띄워도 충돌하지 않는다.
# MySQL·Redis 는 호스트에 포트를 열지 않는다. 확인은 docker compose -f compose.full.yaml exec mysql|redis 로 한다
name: fivexbread-full

x-app: &app
  image: fivexbread-app:local
  environment:
    SPRING_PROFILES_ACTIVE: docker
    DB_HOST: mysql
    DB_USERNAME: fivexbread
    DB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 필요}
    REDIS_HOST: redis
    JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 필요}
    PICKUP_SECRET: ${PICKUP_SECRET:?.env 에 PICKUP_SECRET 필요}
    ADMIN_INITIAL_PHONE: ${ADMIN_INITIAL_PHONE:-}
    ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  mem_limit: 768m                 # 앱 1개당. 힙은 이 중 75% (Dockerfile MaxRAMPercentage)
  stop_grace_period: 30s          # graceful shutdown(20초)이 끝나기 전에 SIGKILL 하지 않게
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  mysql:                          # compose.yaml 과 같은 설정 + healthcheck
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fivexbread
      MYSQL_USER: fivexbread
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 필요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 필요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    # 127.0.0.1(TCP)로 확인한다. 첫 기동의 초기화 단계에서는 임시 서버가 소켓으로만 떠 있어서
    # localhost(소켓)로 ping 하면 앱 사용자가 생기기 전에 healthy 가 될 수 있다
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -ufivexbread -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' fivexbread > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:                          # compose.yaml 과 같은 설정 + healthcheck
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app
    build: ./backend              # 이미지는 app1 이 한 번 빌드하고 app2·3 은 같은 태그를 쓴다
  app2:
    <<: *app
    pull_policy: never
  app3:
    <<: *app
    pull_policy: never

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"                   # 8081(X-Upstream 포함)은 공개하지 않는다
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }

  # 부하 테스트 (load/README.md). up 에는 포함되지 않고 run 으로만 실행: docker compose -f compose.full.yaml run --rm k6 run /load/reserve.js
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    volumes:
      - ./load:/load:ro
    environment:
      BASE_URL: http://nginx:8081   # 내부 확인용 포트: X-Upstream 헤더로 앱별 처리 수를 센다 (nginx.conf)
    depends_on:
      - nginx

volumes:
  mysql-data: {}
  redis-data: {}
